# Kubernetes WAS v1alpha3 E2E (Kubernetes 1.37). Harness added in sequencing step
# 7.2; the per-version e2e assertions land with the v1alpha3 provider (step 7.6).
# Wire this file into a Buildkite pipeline once those tests exist.
- label: 'Test Kubernetes WAS v1alpha3 E2E (nightly operator)'
  instance_size: large
  image: golang:1.26-bookworm
  commands:
    - source .buildkite/setup-env.sh

    # kind must be new enough to run a Kubernetes 1.37 node image.
    - echo "--- Installing kind v0.32.0"
    - curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.32.0/kind-linux-amd64
    - chmod +x ./kind
    - mv ./kind /usr/local/bin/kind

    # Create the kind cluster serving both scheduling.k8s.io APIs. Selecting
    # v1alpha3 requires the target-version pin (--kubernetes-was-target-version,
    # step 7.5), since the selector otherwise auto-picks the more mature v1beta1.
    - kind create cluster --wait 900s --config ./ci/kind-config-buildkite-kubernetes-was-1.37.yml
    - kubectl config set clusters.kind-kind.server https://docker:6443

    # Build the nightly KubeRay operator image and deploy with the Kubernetes WAS batch scheduler.
    # The v1alpha3 overlay pins --kubernetes-was-target-version=v1alpha3 (the selector otherwise
    # auto-picks the more mature v1beta1) and enables KubernetesWASPodGroupPreemptionPolicy for the
    # preemption e2e (the cluster-side PodGroupPreemptionPolicy gate is set in the kind config).
    - pushd ray-operator
    - IMG=kuberay/operator:nightly make docker-image
    - kind load docker-image kuberay/operator:nightly
    - IMG=kuberay/operator:nightly make deploy-kubernetes-was-v1alpha3
    - kubectl wait --timeout=90s --for=condition=Available=true deployment kuberay-operator

    # Run Kubernetes WAS v1alpha3 e2e tests.
    - echo "--- START:Running Kubernetes WAS v1alpha3 E2E tests"
    - set -o pipefail
    - mkdir -p "$(pwd)/tmp" && export KUBERAY_TEST_OUTPUT_DIR=$(pwd)/tmp
    - echo "KUBERAY_TEST_OUTPUT_DIR=$$KUBERAY_TEST_OUTPUT_DIR"
    - KUBERAY_TEST_TIMEOUT_SHORT=1m KUBERAY_TEST_TIMEOUT_MEDIUM=5m KUBERAY_TEST_TIMEOUT_LONG=10m go test -timeout 30m -v -run 'TestKubernetesWASV1Alpha3_' ./test/e2ekuberneteswas 2>&1 | awk -f ../.buildkite/format.awk | tee $$KUBERAY_TEST_OUTPUT_DIR/gotest.log || (kubectl logs --tail -1 -l app.kubernetes.io/name=kuberay | tee $$KUBERAY_TEST_OUTPUT_DIR/kuberay-operator.log && cd $$KUBERAY_TEST_OUTPUT_DIR && find . -name "*.log" | tar -cf /artifact-mount/e2e-kubernetes-was-v1alpha3-log.tar -T - && exit 1)
    - echo "--- END:Kubernetes WAS v1alpha3 E2E tests finished"
