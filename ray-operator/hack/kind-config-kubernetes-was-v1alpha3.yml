kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  apiServerAddress: "127.0.0.1"
  # Ensure stable port so we can rewrite the server address later.
  apiServerPort: 6443
# Adding this so containers from the same docker network can access it.
# https://blog.scottlowe.org/2019/07/30/adding-a-name-to-kubernetes-api-server-certificate/
nodes:
- role: control-plane
  image: kindest/node:v1.37.0
  kubeadmConfigPatches:
  - |
    kind: ClusterConfiguration
    apiServer:
      extraArgs:
        # GenericWorkload serves the Workload/PodGroup APIs; PodGroupPreemptionPolicy
        # lets the apiserver persist the gated PodGroup/Workload preemptionPolicy field.
        # TopologyAwareWorkloadScheduling and CompositePodGroup (alpha in 1.37) enable the
        # topology-aware layout: a CompositePodGroup with a PodGroup per member.
        feature-gates: "GenericWorkload=true,PodGroupPreemptionPolicy=true,TopologyAwareWorkloadScheduling=true,CompositePodGroup=true"
        runtime-config: "scheduling.k8s.io/v1beta1=true,scheduling.k8s.io/v1alpha3=true"
      certSANs:
        - "127.0.0.1"
        - "docker"
    controllerManager:
      extraArgs:
        feature-gates: "GenericWorkload=true,PodGroupPreemptionPolicy=true,TopologyAwareWorkloadScheduling=true,CompositePodGroup=true"
    scheduler:
      extraArgs:
        feature-gates: "GenericWorkload=true,PodGroupPreemptionPolicy=true,TopologyAwareWorkloadScheduling=true,CompositePodGroup=true"
- role: worker
  image: kindest/node:v1.37.0
  # Labeled topology domains for the topology-aware scheduling e2e tests.
  kubeadmConfigPatches:
  - |
    kind: JoinConfiguration
    nodeRegistration:
      kubeletExtraArgs:
        node-labels: "e2e.kuberay.io/rack=r1,e2e.kuberay.io/zone=z1"
- role: worker
  image: kindest/node:v1.37.0
  # Labeled topology domains for the topology-aware scheduling e2e tests.
  kubeadmConfigPatches:
  - |
    kind: JoinConfiguration
    nodeRegistration:
      kubeletExtraArgs:
        node-labels: "e2e.kuberay.io/rack=r2,e2e.kuberay.io/zone=z2"
