# Local-run variant of ci/kind-config-buildkite-kubernetes-was-1.37.yml.
# Drops the Buildkite docker-network networking block (apiServerAddress 0.0.0.0,
# fixed port, certSANs=docker) so kind uses local defaults (127.0.0.1, random
# port). Kubeadm feature-gates / runtime-config are identical to the CI config.
#
# Uses the published kindest/node:v1.37.0 GA image.
# Create the cluster with:
#   kind create cluster --name was-1-37 --config ray-operator/hack/kind-config-kubernetes-was-1.37.yml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
- role: control-plane
  image: kindest/node:v1.37.0
  kubeadmConfigPatches:
  - |
    kind: ClusterConfiguration
    apiServer:
      extraArgs:
        # GenericWorkload serves the Workload/PodGroup APIs; PodGroupPreemptionPolicy
        # keeps the alpha preemptionPolicy field from being pruned (exercised by the
        # v1alpha3 preemption e2e).
        feature-gates: "GenericWorkload=true,PodGroupPreemptionPolicy=true"
        runtime-config: "scheduling.k8s.io/v1beta1=true,scheduling.k8s.io/v1alpha3=true"
    controllerManager:
      extraArgs:
        feature-gates: "GenericWorkload=true,PodGroupPreemptionPolicy=true"
    scheduler:
      extraArgs:
        feature-gates: "GenericWorkload=true,PodGroupPreemptionPolicy=true"
