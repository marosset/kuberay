kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  apiServerAddress: "0.0.0.0"
  # Ensure stable port so we can rewrite the server address later.
  apiServerPort: 6443
# Adding this so containers from the same docker network can access it.
# https://blog.scottlowe.org/2019/07/30/adding-a-name-to-kubernetes-api-server-certificate/
nodes:
- role: control-plane
  # Built locally via `make kind-node-image` (kind build node-image from the
  # kubernetes v1.37.0-rc.0 tag). v0.37 removes scheduling.k8s.io/v1alpha2 and
  # serves v1beta1 + v1alpha3. Swap for a published kindest/node once 1.37 GAs.
  image: kindest/node:v1.37.0-rc.0
  kubeadmConfigPatches:
  - |
    kind: ClusterConfiguration
    apiServer:
      extraArgs:
        feature-gates: "GenericWorkload=true"
        # A production 1.37 cluster serves both scheduling.k8s.io APIs. The WAS
        # selector auto-picks the most mature served version (v1beta1); pin
        # v1alpha3 with --kubernetes-was-target-version to exercise the alpha.
        runtime-config: "scheduling.k8s.io/v1beta1=true,scheduling.k8s.io/v1alpha3=true"
      certSANs:
        - "docker"
    controllerManager:
      extraArgs:
        feature-gates: "GenericWorkload=true"
    scheduler:
      extraArgs:
        feature-gates: "GenericWorkload=true,GangScheduling=true"
